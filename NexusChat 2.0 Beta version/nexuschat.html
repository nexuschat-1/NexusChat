    <script src="nexuschat.js"></script>
    <script>
        var chat_recent_bar_main = document.getElementById('chat-recent_bar');
        var main_contact_div = document.getElementById('main_contact_div');
        var user_settings = document.getElementById('user_settings');

        chat_recent_bar_main.style.display = "flex";
        main_contact_div.style.display = "none";
        user_settings.style.display = "none";
        
        function rePos(div_btn,device) {
            if (div_btn === "chat") {
                if(device == "mobile"){
                    document.getElementById("chat_bar").style.width = "0px";
                    document.getElementById("chat_bar").style.visibility = "hidden";
                    document.getElementById("recent_bar").style.width = "100%";
                    document.getElementById("recent_bar").style.visibility = "visible";
                    chat_recent_bar_main.style.display = "flex";
                    main_contact_div.style.display = "none";
                    user_settings.style.display = "none";

                    now_chatting_with_id = 0; //reseting now_chat_with value in moble after returning to contact list in chat div
                }else {
                    chat_recent_bar_main.style.display = "flex";
                    main_contact_div.style.display = "none";
                    user_settings.style.display = "none";
                }
            }else if(div_btn === "contact"){
                main_contact_div.style.display = "flex";
                chat_recent_bar_main.style.display = "none";
                user_settings.style.display = "none";
            }else if(div_btn === "settings"){
                user_settings.style.display = "flex";
                chat_recent_bar_main.style.display = "none";
                main_contact_div.style.display = "none";
            }else{
                alert("unexpected error happend");
            }
        }
        let screenWidth = window.screen.width;
        var setting__section__ = document.getElementById("setting__section__");
        var content_main_form_cover = document.getElementById("content_main_form_cover");
        var blocked_contacts = document.getElementById("blocked_contacts");
        var back_settings = document.getElementById("back_to_settings");
        function select_settins__(click){
            if(click == "account"){
                if(screenWidth <= 1000){
                    setting__section__.style.display = "none";
                    content_main_form_cover.style.display = "flex";
                    content_main_form_cover.style.width = "100%";
                    blocked_contacts.style.display = "none"; 
                    back_settings.style.display = "flex"
                }else{
                    setting__section__.style.display = "flex";
                    content_main_form_cover.style.display = "flex";
                    blocked_contacts.style.display = "none"; 
                } 
            }else{
                if(screenWidth <= 1000){
                    setting__section__.style.display = "none";
                    content_main_form_cover.style.display = "none";
                    blocked_contacts.style.width = "100%";
                    blocked_contacts.style.display = "flex";
                    back_settings.style.display = "flex"
                }else{
                    setting__section__.style.display = "flex";
                    content_main_form_cover.style.display = "none";
                    blocked_contacts.style.display = "flex";
                }
            }
        }
        function back_to_settings(){
            if(screenWidth <= 1000){
                setting__section__.style.display = "flex";
                content_main_form_cover.style.display = "none";
                blocked_contacts.style.display = "none"; 
            }else{
                setting__section__.style.display = "flex";
                content_main_form_cover.style.display = "flex";
                blocked_contacts.style.display = "none"; 
            } 
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        async function _show_password_() {
            document.getElementsByName("password")[0].type = "text";
            await sleep(2000); // Pause for 2 seconds
            document.getElementsByName("password")[0].type = "password";
        }
        if(screenWidth < 800){
            document.getElementById("recent_contact_title_id").innerHTML = "<h2 style='margin-top: 10px;'>NexusChat</h2>&nbsp;&nbsp;<img src='src_img/logo.jpeg' alt='NexusChat logo' style='width: 30px; height: 30px;'>";
        }else {
            document.getElementById("recent_contact_title_id").innerHTML = "Peoples you might know";
        }
    </script>
