<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="card-container">
        <div class="card" id="cardElement">
            <!-- Registration Form View -->
            <div class="form-view signup-view">
                <nav>
                    <div class="logo">
                        <span>NexusChat</span>
                    </div>
                    <div class="nav-links">
                        <a href="#">Home</a>
                        <a href="#">info</a>
                        <a href="#">Contact</a>
                        <a href="#">Privacy and policy</a>
                    </div>
                </nav>
                <div class="form">
                    <div class="subtitle">Welcome to NexusChat</div>
                    <h1>Create new account</h1>
                    <div class="login-link">Already A Member? <button type="button" class="link-btn" onclick="toggleAuthView()">Log In</button></div>
                    <form action="" method="POST">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" placeholder="Username" name="username">
                        </div>
                        <div class="form-row">
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" placeholder="Password" name="pass">
                            </div>
                            <div class="input-group">
                                <label>Confirm Password</label>
                                <input type="password" placeholder="Confirm Password" name="confrimpass">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" placeholder="Email" name="email">
                        </div>
                        <div class="input-group">
                            <label>Phoneno</label>
                            <input type="number" placeholder="Mobile Number" name="number">
                        </div>
                        <div class="gender-group">
                            <label class="gender-label">Gender : </label>
                            <div class="radio-options">
                                <label class="radio-option">
                                <input type="radio" name="gender" value="boy">Male
                                </label>
                                <label class="radio-option">
                                <input type="radio" name="gender" value="girl">Female
                                </label>
                                <label class="radio-option">
                                <input type="radio" name="gender" value="rather-not-to-say">Rather not to say
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn">Create account</button>
                    </form>
                </div>
            </div>

            <!-- Login Form View -->
            <div class="form-view login-view">
                <nav>
                    <div class="logo">
                        <span>NexusChat</span>
                    </div>
                    <div class="nav-links">
                        <a href="#">Home</a>
                        <a href="#">info</a>
                        <a href="#">Contact</a>
                        <a href="#">Privacy and policy</a>
                    </div>
                </nav>
                <div class="form">
                    <div class="subtitle">Welcome Back</div>
                    <h1>Continue Exploring NexusChat</h1>
                    <div class="login-link">New to NexusChat? <button type="button" class="link-btn" onclick="toggleAuthView()">Create Account</button></div>
                    <form action="" method="POST">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" placeholder="Username" name="login_username">
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" placeholder="Password" name="login_pass">
                        </div>
                        <button type="submit" class="btn">Log In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script>
    function toggleAuthView() {
        const card = document.getElementById('cardElement');
        card.classList.toggle('flipped');
    }
</script>
</body>
</html>
