<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="card">
        <nav>
            <div class="logo">
                <span>NexusChat</span>
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">info</a>
                <a href="#">Contact</a>
                <a href="#">Privacy and policy</a>
            </div>
        </nav>
        <div class="form">
            <div class="subtitle">Welcome to NexusChat</div>
            <h1>Create new account</h1>
            <div class="login-link">Already A Member? <a href="#">Log In</a></div>
            <form action="" method="POST">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Username" name="username">
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Password" name="pass">
                    </div>
                    <div class="input-group">
                        <label>Conform Password</label>
                        <input type="password" placeholder="Conform Password" name="confrompass">
                    </div>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Email" name="email">
                </div>
                <div class="input-group">
                    <label>Phoneno</label>
                    <input type="number" placeholder="Mobile Number" name="number">
                </div>
                <div class="gender-group">
                    <label class="gender-label">Gender : </label>
                    <div class="radio-options">
                        <label class="radio-option">
                        <input type="radio" name="gender" value="boy">Male
                        </label>
                        <label class="radio-option">
                        <input type="radio" name="gender" value="girl">Female
                        </label>
                        <label class="radio-option">
                        <input type="radio" name="gender" value="rather-not-to-say">Rather not to say
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn">Create account</button>
            </form>
        </div>
    </div>
</body>
</html>
